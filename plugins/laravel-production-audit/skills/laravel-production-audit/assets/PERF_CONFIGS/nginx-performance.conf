# Nginx server block — performance TEMPLATE
# Project: <PROJECT NAME>   Audit date: <DATE>
# Goal: Nginx serves static assets directly (never PHP), compresses responses,
# and sets cache headers. PHP only handles dynamic routes.

server {
    listen 80;
    server_name <DOMAIN>;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # reason: compress text responses; skip already-compressed binary types
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # reason: static assets served by Nginx, cached hard — never hit PHP
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|woff2?|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;                # reason: SECURITY — block the classic
                                            # PHP-FPM RCE (upload evil.jpg, request
                                            # /evil.jpg/x.php). Must be first.
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;   # reason: don't leak PHP version
        fastcgi_read_timeout 60;
    }

    location ~ /\.(?!well-known).* {
        deny all;                           # reason: block dotfiles (.env, .git)
    }
}
