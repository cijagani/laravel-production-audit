; OPcache — production TEMPLATE (PHP 8.4)
; Project: <PROJECT NAME>   Audit date: <DATE>

opcache.enable = 1
opcache.enable_cli = 1                 ; reason: queue workers run via CLI and benefit from OPcache
opcache.memory_consumption = 256       ; reason: MB — fits full Laravel + app code cached
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000  ; reason: must exceed `find . -name "*.php" | wc -l` — RECOMPUTE
opcache.validate_timestamps = 0        ; reason: PRODUCTION must be 0; clears on deploy via opcache reset
opcache.save_comments = 1              ; reason: required — Laravel reads attributes/annotations
opcache.jit = tracing                  ; reason: helps CPU-bound code; harmless for I/O-bound
opcache.jit_buffer_size = 64M          ; reason: conservative — don't over-allocate for an I/O-bound app

; Optional preload (only if NOT using Octane):
; opcache.preload = /var/www/html/preload.php
; opcache.preload_user = www-data
