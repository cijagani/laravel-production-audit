; php.ini — CLI / queue-worker TEMPLATE
; Project: <PROJECT NAME>   Audit date: <DATE>
; Queue workers are long-running and do heavier batch work than web requests,
; so the limits differ from php-web.ini.

memory_limit = 512M            ; reason: batch jobs need more headroom than a web request
max_execution_time = 0         ; reason: long-running jobs; bound runtime via job $timeout + Horizon, not here
expose_php = Off
display_errors = Off
log_errors = On
error_log = /var/log/php/cli-error.log
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; OPcache for CLI is enabled in opcache.ini (opcache.enable_cli = 1)
