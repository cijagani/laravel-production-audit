; PHP-FPM pool — production TEMPLATE
; Project: <PROJECT NAME>   Audit date: <DATE>
;
; ALL numbers below assume a 2 GB RAM / 2-core baseline. RECOMPUTE every value
; against the REAL production box before deploying (the audit host is usually a
; dev machine, not production).
;
; Sizing formulas:
;   pm.max_children      = floor(available_RAM_MB / avg_worker_RSS_MB)
;                          avg_worker_RSS_MB = 100 (safe Laravel default; 80–120)
;                          2048MB / 100MB ≈ 20 -> leave headroom -> 16
;   pm.start_servers     = cpu_cores * 2          (2 cores -> 4)
;   pm.min_spare_servers = cpu_cores              (2 cores -> 2)
;   pm.max_spare_servers = cpu_cores * 2          (2 cores -> 4)
;   detect: RAM via /proc/meminfo, cores via nproc

[www]
user = www-data
group = www-data
listen = /run/php/php8.4-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic                       ; reason: variable web traffic; use 'ondemand' only for very low traffic
pm.max_children = 16               ; reason: floor(2048/100) w/ headroom @2GB — RECOMPUTE
pm.start_servers = 4               ; reason: cpu_cores*2 @2 cores — RECOMPUTE
pm.min_spare_servers = 2           ; reason: cpu_cores @2 cores — RECOMPUTE
pm.max_spare_servers = 4           ; reason: cpu_cores*2 @2 cores — RECOMPUTE
pm.max_requests = 500              ; reason: recycle workers to bound memory leaks
pm.process_idle_timeout = 10s

request_terminate_timeout = 60     ; reason: kill runaway requests so one bad request can't pin a worker
catch_workers_output = yes
decorate_workers_output = no

; reason: surface pool saturation in monitoring
pm.status_path = /fpm-status
ping.path = /fpm-ping

php_admin_value[error_log] = /var/log/php/fpm-www-error.log
php_admin_flag[log_errors] = on
