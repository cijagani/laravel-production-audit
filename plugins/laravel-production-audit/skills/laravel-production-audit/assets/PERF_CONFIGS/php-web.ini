; php.ini — WEB workers (PHP-FPM) TEMPLATE
; Project: <PROJECT NAME>   Audit date: <DATE>

memory_limit = 256M            ; reason: web requests should be small; queue workers get more (see php-cli.ini)
max_execution_time = 30        ; reason: a web request that runs >30s belongs on a queue
upload_max_filesize = 16M      ; reason: set to the largest legitimate upload; smaller = safer
post_max_size = 20M            ; reason: >= upload_max_filesize + form overhead
expose_php = Off               ; reason: don't leak the PHP version in headers
display_errors = Off           ; reason: production must never render errors to users
log_errors = On
error_log = /var/log/php/web-error.log
realpath_cache_size = 4096K    ; reason: large Laravel autoload tree — cache resolved paths
realpath_cache_ttl = 600
