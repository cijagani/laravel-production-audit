; Supervisor — Laravel workers TEMPLATE
; Project: <PROJECT NAME>   Audit date: <DATE>
; Adjust the artisan path (/var/www/html) and add a [program:...] block for any
; extra long-running process found in §8 (e.g. Reverb).

[program:laravel-horizon]
process_name=%(program_name)s
command=php /var/www/html/artisan horizon
autostart=true
autorestart=true
stopasgroup=true                 ; reason: stop the whole Horizon process tree together on deploy
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/horizon.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=3600                ; reason: let in-flight jobs finish on graceful restart

; Scheduler: SYSTEM CRON is preferred (see crontab entry below). This supervised
; alternative is provided for environments without crontab access — enable ONE,
; never both, or tasks double-run.
;
; [program:laravel-schedule]
; process_name=%(program_name)s
; command=php /var/www/html/artisan schedule:work
; autostart=true
; autorestart=true
; user=www-data
; redirect_stderr=true
; stdout_logfile=/var/log/supervisor/schedule.log

; ── Crontab entry for the scheduler (preferred) ──────────────────────────────
; * * * * * www-data cd /var/www/html && php artisan schedule:run >> /dev/null 2>&1
